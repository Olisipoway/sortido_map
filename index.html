<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Reach Map – Lisbon</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }

    #controls {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    #controls label { font-size: 13px; font-weight: 600; color: #333; }
    #controls select, #controls input[type=range] { font-size: 13px; }
    #controls button {
      font-size: 13px;
      padding: 5px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #controls button:hover { background: #1d4ed8; }
    #controls button:disabled { background: #93c5fd; cursor: default; }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      display: none;
    }

    .site-label {
      background: transparent;
      border: none;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      color: #111;
      text-shadow: 0 0 3px white, 0 0 3px white;
    }
  </style>
</head>
<body>
<div id="controls">
  <label>Site:</label>
  <select id="siteSelect">
    <option value="lambert">Quinta do Lambert (Lumiar)</option>
    <option value="miraflores">Miraflores (Algés)</option>
    <option value="arif">Arif (Benfica)</option>
  </select>
  <label>Minutes:</label>
  <input type="range" id="timeRange" min="10" max="35" value="22" step="0.5" style="width:90px" />
  <span id="timeVal" style="font-size:13px;min-width:32px">22 min</span>
  <button id="isoBtn">Draw reach</button>
  <button id="clearBtn">Clear</button>
</div>
<div id="map"></div>
<div id="status" id="status"></div>

<script>
const SITES = {
  lambert:    { lat: 38.7713, lon: -9.1530, label: "Lambert (Lumiar)",    color: "#2563eb" },
  miraflores: { lat: 38.7158, lon: -9.2314, label: "Miraflores (Algés)", color: "#16a34a" },
  arif:       { lat: 38.7466, lon: -9.1769, label: "Arif (Benfica)",     color: "#dc2626" },
};

const VALHALLA = "https://valhalla1.openstreetmap.de/isochrone";

const map = L.map("map", { zoomControl: true }).setView([38.737, -9.178], 12);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }
).addTo(map);

const markers = {};
const isoLayers = {};

Object.entries(SITES).forEach(([key, s]) => {
  const icon = L.divIcon({
    className: "",
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${s.color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
  const m = L.marker([s.lat, s.lon], { icon })
    .addTo(map)
    .bindPopup(`<b>${s.label}</b>`);

  const labelIcon = L.divIcon({
    className: "site-label",
    html: s.label,
    iconAnchor: [-10, 6],
  });
  L.marker([s.lat, s.lon], { icon: labelIcon, interactive: false }).addTo(map);

  markers[key] = m;
});

const timeRange = document.getElementById("timeRange");
const timeVal   = document.getElementById("timeVal");
const isoBtn    = document.getElementById("isoBtn");
const clearBtn  = document.getElementById("clearBtn");
const status    = document.getElementById("status");

timeRange.addEventListener("input", () => {
  timeVal.textContent = timeRange.value + " min";
});

function showStatus(msg) {
  status.textContent = msg;
  status.style.display = "block";
}
function hideStatus() {
  status.style.display = "none";
}

isoBtn.addEventListener("click", async () => {
  const key  = document.getElementById("siteSelect").value;
  const mins = parseFloat(timeRange.value);
  const site = SITES[key];

  isoBtn.disabled = true;
  showStatus("Fetching isochrone…");

  try {
    const body = {
      locations: [{ lon: site.lon, lat: site.lat }],
      costing: "auto",
      contours: [{ time: mins }],
      polygons: true,
    };

    const res = await fetch(VALHALLA, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();

    if (isoLayers[key]) {
      map.removeLayer(isoLayers[key]);
    }

    isoLayers[key] = L.geoJSON(geojson, {
      style: {
        color: site.color,
        fillColor: site.color,
        fillOpacity: 0.15,
        weight: 2,
        opacity: 0.8,
      },
    }).addTo(map);

    map.fitBounds(isoLayers[key].getBounds(), { padding: [30, 30] });
    hideStatus();
  } catch (e) {
    showStatus("Error: " + e.message);
  } finally {
    isoBtn.disabled = false;
  }
});

clearBtn.addEventListener("click", () => {
  Object.values(isoLayers).forEach(l => map.removeLayer(l));
  Object.keys(isoLayers).forEach(k => delete isoLayers[k]);
  hideStatus();
});
</script>
</body>
</html>
