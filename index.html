<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Reach Map – Lisbon</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; cursor: crosshair; }

    #controls {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #controls label { font-size: 13px; font-weight: 600; color: #333; }
    #controls button {
      font-size: 13px;
      padding: 5px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #controls button:hover { background: #1d4ed8; }
    #controls button.secondary { background: #6b7280; }
    #controls button.secondary:hover { background: #4b5563; }

    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
    }

    .pop-popup { font-size: 13px; line-height: 1.7; min-width: 180px; }
    .pop-popup b { font-size: 14px; }
    .pop-popup .row { display: flex; justify-content: space-between; gap: 12px; }
    .pop-popup .row span:last-child { font-weight: 600; }
  </style>
</head>
<body>
<div id="controls">
  <label>Travel time:</label>
  <input type="range" id="timeRange" min="5" max="25" value="10" step="0.5" style="width:90px" />
  <span id="timeVal" style="font-size:13px;min-width:32px">10 min</span>
  <button id="clearBtn" class="secondary">Clear all</button>
</div>
<div id="map"></div>
<div id="hint">Click anywhere on the map to place a marker and draw its reach</div>

<script>
const COLORS = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2"];
let colorIdx = 0;
let popGrid = null;

const map = L.map("map", { zoomControl: true }).setView([38.737, -9.178], 12);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

// Load population grid once
fetch("pop_grid_2025_full.json")
  .then(r => r.json())
  .then(d => { popGrid = d; })
  .catch(() => { popGrid = null; });

// Ray-casting point-in-polygon (GeoJSON coords are [lon, lat])
function pointInRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function pointInPolygon(lon, lat, geometry) {
  if (geometry.type === "Polygon") {
    const outer = geometry.coordinates[0];
    if (!pointInRing(lon, lat, outer)) return false;
    for (let h = 1; h < geometry.coordinates.length; h++) {
      if (pointInRing(lon, lat, geometry.coordinates[h])) return false;
    }
    return true;
  }
  if (geometry.type === "MultiPolygon") {
    return geometry.coordinates.some(poly => {
      if (!pointInRing(lon, lat, poly[0])) return false;
      for (let h = 1; h < poly.length; h++) {
        if (pointInRing(lon, lat, poly[h])) return false;
      }
      return true;
    });
  }
  return false;
}

function sumPopulation(geojson) {
  if (!popGrid) return null;
  const cols = popGrid.cols;
  const li  = cols.indexOf("lat"),  loi = cols.indexOf("lon");
  const pi  = cols.indexOf("pop"),  a1  = cols.indexOf("age15_24");
  const a2  = cols.indexOf("age25_64"), ri = cols.indexOf("rented_homes");
  const ii  = cols.indexOf("income_idx");

  const geometries = geojson.features.map(f => f.geometry);

  let pop = 0, age1524 = 0, age2564 = 0, rented = 0, spendPop = 0;
  for (const row of popGrid.rows) {
    const lat = row[li], lon = row[loi];
    for (const geom of geometries) {
      if (pointInPolygon(lon, lat, geom)) {
        pop      += row[pi];
        age1524  += row[a1];
        age2564  += row[a2];
        rented   += row[ri];
        spendPop += row[pi] * (ii >= 0 ? row[ii] : 1);
        break;
      }
    }
  }
  return { pop, age1524, age2564, rented, spendPop };
}

function fmt(n) { return n.toLocaleString("pt-PT"); }

const timeRange = document.getElementById("timeRange");
const timeVal   = document.getElementById("timeVal");
const clearBtn  = document.getElementById("clearBtn");
const hint      = document.getElementById("hint");

timeRange.addEventListener("input", () => {
  timeVal.textContent = timeRange.value + " min";
});

// OSRM isochrone: spoke-based approach
// Generate points at N angles × M distances, query travel times, build polygon
async function osrmIsochrone(lat, lng, mins) {
  const OSRM = "https://router.project-osrm.org/table/v1/driving";
  const budget = mins * 60; // seconds
  const ANGLES = 36;        // every 10 degrees
  const DISTS  = [500, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 6500, 8000]; // metres
  const R_EARTH = 6371000;

  // Generate spoke points
  const spokes = [];
  for (let a = 0; a < ANGLES; a++) {
    const angle = (a * 360 / ANGLES) * Math.PI / 180;
    for (const d of DISTS) {
      const dLat = (d * Math.cos(angle)) / R_EARTH * (180 / Math.PI);
      const dLon = (d * Math.sin(angle)) / R_EARTH * (180 / Math.PI) / Math.cos(lat * Math.PI / 180);
      spokes.push({ a, d, lat: lat + dLat, lon: lng + dLon });
    }
  }

  // Batch into chunks of 90 destinations (OSRM public server limit ~100 coords total)
  const CHUNK = 90;
  const durations = new Array(spokes.length).fill(Infinity);

  for (let i = 0; i < spokes.length; i += CHUNK) {
    const chunk = spokes.slice(i, i + CHUNK);
    const coords = `${lng},${lat};` + chunk.map(p => `${p.lon},${p.lat}`).join(";");
    const url = `${OSRM}/${coords}?sources=0&annotations=duration`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`OSRM HTTP ${res.status}`);
    const data = await res.json();
    const row = data.durations[0]; // travel times from source (index 0) to each dest
    chunk.forEach((_, j) => { durations[i + j] = row[j + 1] ?? Infinity; });
  }

  // For each angle, find furthest reachable distance
  const boundary = [];
  for (let a = 0; a < ANGLES; a++) {
    const spokePoints = spokes
      .map((p, i) => ({ ...p, dur: durations[i] }))
      .filter(p => p.a === a)
      .sort((x, y) => x.d - y.d);

    let best = null;
    for (const p of spokePoints) {
      if (p.dur <= budget) best = p;
      else break;
    }
    // If no point reachable, use nearest reachable from any angle fallback
    if (!best) best = spokePoints[0];
    boundary.push([best.lon, best.lat]);
  }

  boundary.push(boundary[0]); // close ring
  return {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      geometry: { type: "Polygon", coordinates: [boundary] },
      properties: {},
    }],
  };
}

const placed = [];

map.on("click", async (e) => {
  const { lat, lng } = e.latlng;
  const mins  = parseFloat(timeRange.value);
  const color = COLORS[colorIdx % COLORS.length];
  colorIdx++;

  const icon = L.divIcon({
    className: "",
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });

  const marker = L.marker([lat, lng], { icon }).addTo(map);
  hint.textContent = "Fetching isochrone…";

  try {
    const geojson = await osrmIsochrone(lat, lng, mins);

    const isoLayer = L.geoJSON(geojson, {
      style: { color, fillColor: color, fillOpacity: 0.15, weight: 2, opacity: 0.8 },
    }).addTo(map);

    // Population count
    hint.textContent = "Counting population…";
    const stats = sumPopulation(geojson);

    let popHtml = "";
    if (stats) {
      popHtml = `
        <hr style="margin:6px 0;border-color:#eee"/>
        <div class="row"><span>Residents</span><span>${fmt(stats.pop)}</span></div>
        <div class="row"><span>Median income</span><span>${fmt(Math.round(stats.spendPop / stats.pop * 12316))} €/yr</span></div>
        <div class="row"><span>Age 15–24</span><span>${fmt(stats.age1524)}</span></div>
        <div class="row"><span>Age 25–64</span><span>${fmt(stats.age2564)}</span></div>
        <div class="row"><span>Rented homes</span><span>${fmt(stats.rented)}</span></div>`;
    }

    marker.bindPopup(`
      <div class="pop-popup">
        <b>${mins} min reach</b><br>
        <span style="color:#666;font-size:11px">${lat.toFixed(4)}, ${lng.toFixed(4)}</span>
        ${popHtml}
      </div>
    `).openPopup();

    placed.push({ marker, isoLayer });
    hint.textContent = "Click anywhere to add another marker";
  } catch (err) {
    hint.textContent = "Error: " + err.message;
    map.removeLayer(marker);
    colorIdx--;
  }
});

clearBtn.addEventListener("click", () => {
  placed.forEach(({ marker, isoLayer }) => {
    map.removeLayer(marker);
    map.removeLayer(isoLayer);
  });
  placed.length = 0;
  colorIdx = 0;
  hint.textContent = "Click anywhere on the map to place a marker and draw its reach";
});
</script>
</body>
</html>
