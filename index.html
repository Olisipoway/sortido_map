<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Reach Map – Lisbon</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; cursor: crosshair; }

    #controls {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #controls label { font-size: 13px; font-weight: 600; color: #333; }
    #controls button {
      font-size: 13px;
      padding: 5px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #controls button:hover { background: #1d4ed8; }
    #controls button:disabled { background: #93c5fd; cursor: default; }
    #controls button.secondary { background: #6b7280; }
    #controls button.secondary:hover { background: #4b5563; }

    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="controls">
  <label>Travel time:</label>
  <input type="range" id="timeRange" min="10" max="35" value="22" step="0.5" style="width:90px" />
  <span id="timeVal" style="font-size:13px;min-width:32px">22 min</span>
  <button id="clearBtn" class="secondary">Clear all</button>
</div>
<div id="map"></div>
<div id="hint">Click anywhere on the map to place a marker and draw its reach</div>

<script>
const VALHALLA = "https://valhalla1.openstreetmap.de/isochrone";
const COLORS = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2"];
let colorIdx = 0;

const map = L.map("map", { zoomControl: true }).setView([38.737, -9.178], 12);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const timeRange = document.getElementById("timeRange");
const timeVal   = document.getElementById("timeVal");
const clearBtn  = document.getElementById("clearBtn");
const hint      = document.getElementById("hint");

timeRange.addEventListener("input", () => {
  timeVal.textContent = timeRange.value + " min";
});

const placed = []; // { marker, isoLayer }

map.on("click", async (e) => {
  const { lat, lng } = e.latlng;
  const mins  = parseFloat(timeRange.value);
  const color = COLORS[colorIdx % COLORS.length];
  colorIdx++;

  const icon = L.divIcon({
    className: "",
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });

  const marker = L.marker([lat, lng], { icon }).addTo(map);
  marker.bindPopup(`<b>${lat.toFixed(4)}, ${lng.toFixed(4)}</b><br>${mins} min reach`).openPopup();

  hint.textContent = "Fetching isochrone…";

  try {
    const res = await fetch(VALHALLA, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        locations: [{ lon: lng, lat }],
        costing: "auto",
        contours: [{ time: mins }],
        polygons: true,
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();

    const isoLayer = L.geoJSON(geojson, {
      style: {
        color,
        fillColor: color,
        fillOpacity: 0.15,
        weight: 2,
        opacity: 0.8,
      },
    }).addTo(map);

    placed.push({ marker, isoLayer });
    hint.textContent = "Click anywhere to add another marker";
  } catch (err) {
    hint.textContent = "Error: " + err.message;
    map.removeLayer(marker);
    colorIdx--;
  }
});

clearBtn.addEventListener("click", () => {
  placed.forEach(({ marker, isoLayer }) => {
    map.removeLayer(marker);
    map.removeLayer(isoLayer);
  });
  placed.length = 0;
  colorIdx = 0;
  hint.textContent = "Click anywhere on the map to place a marker and draw its reach";
});
</script>
</body>
</html>
